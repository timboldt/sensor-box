<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sensor Box</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2125; --muted: #6b737d;
    --grid: #e4e7eb; --line: #2f7fc1; --border: #e1e4e8;
    --good: #23a455; --fair: #c99a06; --poor: #e07b24; --bad: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1114; --card: #1a1d22; --text: #eef0f2; --muted: #8b939d;
      --grid: #2a2f36; --line: #5aa9e6; --border: #262a30;
      --good: #3ec46d; --fair: #f2c94c; --poor: #f2994a; --bad: #eb5757;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 28px 0 10px; display: flex; align-items: center; gap: 12px; }
  .status { color: var(--muted); font-size: 13px; }
  .status.offline { color: var(--bad); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .tile, .chart {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  }
  .tile .label { color: var(--muted); font-size: 13px; }
  .tile .value { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .unit { color: var(--muted); font-size: 13px; margin-left: 3px; font-weight: 400; }
  .tile .note { color: var(--muted); font-size: 12px; min-height: 1em; }
  .good { color: var(--good); } .fair { color: var(--fair); }
  .poor { color: var(--poor); } .bad { color: var(--bad); }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; }
  .chart .head { display: flex; justify-content: space-between; font-size: 13px; }
  .chart .head .name { font-weight: 600; }
  .chart .head .range { color: var(--muted); font-variant-numeric: tabular-nums; }
  .chart svg { display: block; width: 100%; height: 150px; }
  .chart svg text { fill: var(--muted); font-size: 11px; }
  .chart .empty { color: var(--muted); font-size: 13px; padding: 60px 0; text-align: center; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button {
    background: var(--card); color: var(--text); border: 0; padding: 4px 10px; font: inherit;
    font-size: 13px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--line); color: #fff; }
  footer { color: var(--muted); font-size: 12px; margin: 28px 0 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Sensor Box</h1>
    <span class="status" id="status">connecting…</span>
  </header>

  <h2>Now</h2>
  <div class="tiles" id="tiles"></div>

  <h2>Trends
    <span class="seg" id="ranges">
      <button data-range="15m">15 min</button><button data-range="6h" class="on">6 h</button><button
        data-range="1d">Day</button><button data-range="7d">Week</button><button
        data-range="30d">Month</button><button data-range="all">All</button>
    </span>
  </h2>
  <div class="charts" id="charts"></div>

  <footer>The last 24 hours are kept in 1-minute detail (back to the device's last restart; earlier hours come from the hourly log). Hourly averages (and pollutant peaks, the fainter line) are kept for about 4½ months. Times are in your browser's time zone.</footer>
</main>

<script>
"use strict";

let US = true;  // replaced by /api/now

// Each metric: how to label, convert, format and colour it.
const METRICS = [
  { key: "temp",  name: "Temperature", unit: () => US ? "°F" : "°C",
    conv: v => US ? v * 9 / 5 + 32 : v, dec: 1, span: () => US ? 2 : 1 },
  // Absolute humidity: the air's actual moisture, which %RH hides by swinging
  // with temperature. The tile notes %RH as well.
  { key: "ah",    name: "Humidity", unit: () => "g/m³", conv: v => v, dec: 1, span: () => 1, min0: true,
    note: d => d.rh === null || d.rh === undefined ? "" : d.rh.toFixed(0) + " %RH" },
  { key: "press", name: "Pressure (MSL)", unit: () => US ? "inHg" : "hPa",
    conv: v => US ? v / 33.8639 : v, dec: () => US ? 2 : 0, span: () => US ? 0.05 : 2 },
  { key: "pm25",  name: "PM2.5", unit: () => "µg/m³", conv: v => v, dec: 0, span: () => 10,
    bands: [9, 35, 55], warm: "pm_warming", peak: "pm25_max", min0: true, capSpikes: true },
  { key: "eco2",  name: "eCO2", unit: () => "ppm", conv: v => v, dec: 0, span: () => 200,
    bands: [800, 1200, 2000], warm: "gas_warming", peak: "eco2_max", min0: true, capSpikes: true },
  { key: "tvoc",  name: "TVOC", unit: () => "ppb", conv: v => v, dec: 0, span: () => 50,
    bands: [220, 660, 2200], warm: "gas_warming", peak: "tvoc_max", min0: true, capSpikes: true },
  // Light as decibels re 1 lux (0 dB = 1 lux, -30 dB = 0.001 lux).
  { key: "lux",   name: "Light", unit: () => "dB", conv: v => 10 * Math.log10(Math.max(v, 1e-5)),
    dec: v => Math.abs(v) < 10 ? 1 : 0, span: () => 10, luxNote: true },
];

const decimals = (m, v) => typeof m.dec === "function" ? m.dec(v) : m.dec;
const fmt = (m, v) => v.toFixed(decimals(m, v));
const band = (m, v) => !m.bands ? "" :
  v <= m.bands[0] ? "good" : v <= m.bands[1] ? "fair" : v <= m.bands[2] ? "poor" : "bad";
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};

// ---- tiles ----

function renderTiles(d) {
  const box = document.getElementById("tiles");
  box.style.minHeight = box.offsetHeight + "px";   // see renderCharts()
  box.replaceChildren();
  for (const m of METRICS) {
    const t = el("div", "tile");
    t.append(el("div", "label", m.name));
    const raw = d[m.key];
    const val = el("div", "value");
    if (raw === null || raw === undefined) {
      val.textContent = "--";
    } else {
      const v = m.conv(raw);
      val.textContent = fmt(m, v);
      const b = band(m, v);
      if (b) val.classList.add(b);
    }
    val.append(el("span", "unit", m.unit()));
    t.append(val);
    let note = m.warm && d[m.warm] ? "warming up" : m.note ? m.note(d) : "";
    if (m.luxNote && raw !== null && raw !== undefined) {
      note = (raw >= 10 ? raw.toFixed(0) : raw.toPrecision(2)) + " lux";
    }
    t.append(el("div", "note", note));
    box.append(t);
  }
  box.style.minHeight = "";
}

// ---- charts (SVG) ----

const SVGNS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};

function timeLabel(t, spanS) {
  const d = new Date(t * 1000);
  if (spanS <= 2 * 86400) {
    return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
}

let pendingDraws = [];

// pts: [[t (unix s), v (display units) or null], ...]; gap: max seconds between joined points
// peaks (optional): a second series, e.g. each hour's highest reading, drawn
// as a fainter line above the averages.
function drawChart(container, m, pts, x0, x1, gap, peaks) {
  const card = el("div", "chart");
  const head = el("div", "head");
  head.append(el("span", "name", m.name + " (" + m.unit() + ")"));
  const range = el("span", "range");
  head.append(range);
  card.append(head);
  container.append(card);

  // Only what's inside the time window counts (and gets drawn).
  const inWindow = p => p[0] >= x0 && p[0] <= x1;
  pts = pts.filter(inWindow);
  peaks = (peaks || []).filter(inWindow);
  const vals = pts.filter(p => p[1] !== null);
  const peakVals = peaks.filter(p => p[1] !== null);
  if (vals.length === 0) {
    card.append(el("div", "empty", "no data yet"));
    return;
  }

  const ty = v => m.log ? Math.log10(Math.max(v, 0.1)) : v;
  let lo = Math.min(...vals.map(p => ty(p[1])));
  let hi = Math.max(...vals.concat(peakVals).map(p => ty(p[1])));
  // Pollutants: a brief huge spike (the SGP30 tops out at 60000) would squash
  // everything else into a flat line. The axis follows the bulk of the main line
  // (its 90th percentile) with room for twice that range; anything higher is
  // pinned to the top edge and marked with a triangle.
  if (m.capSpikes) {
    const sorted = vals.map(p => ty(p[1])).sort((a, b) => a - b);
    const core = sorted[Math.floor(0.9 * (sorted.length - 1))];
    hi = Math.min(hi, lo + 2 * Math.max(core - lo, m.span()));
  }
  const clipAt = hi;
  const minSpan = m.span();
  if (hi - lo < minSpan) { const mid = (hi + lo) / 2; lo = mid - minSpan / 2; hi = mid + minSpan / 2; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  if (m.min0 && lo < 0) { hi -= lo; lo = 0; }   // e.g. PM2.5 can't go below 0

  const vmin = Math.min(...vals.map(p => p[1])), vmax = Math.max(...vals.map(p => p[1]));
  range.textContent = "min " + fmt(m, vmin) + " · max " + fmt(m, vmax) +
    (peakVals.length ? " · peak " + fmt(m, Math.max(...peakVals.map(p => p[1]))) : "");

  // Measured and drawn once all cards exist (see renderCharts), so every card
  // has its final width; drawing while the grid still had one card made the
  // first chart's text tiny.
  pendingDraws.push(() => {
    const W = Math.max(card.clientWidth - 24, 200), H = 150, L = 44, R = 6, T = 8, B = 20;
    const sx = t => L + (t - x0) / (x1 - x0) * (W - L - R);
    const sy = v => T + (1 - (ty(v) - lo) / (hi - lo)) * (H - T - B);
    const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });

    // y grid + labels (3 lines)
    for (let i = 0; i <= 2; i++) {
      const yv = lo + (hi - lo) * i / 2;
      const y = T + (1 - i / 2) * (H - T - B);
      svg.append(svgEl("line", { x1: L, x2: W - R, y1: y, y2: y, stroke: "var(--grid)" }));
      const real = m.log ? Math.pow(10, yv) : yv;
      const lab = svgEl("text", { x: L - 6, y: y + 4, "text-anchor": "end" });
      lab.textContent = fmt(m, real);
      svg.append(lab);
    }
    // x labels (4)
    for (let i = 0; i <= 3; i++) {
      const t = x0 + (x1 - x0) * i / 3;
      const lab = svgEl("text", { x: sx(t), y: H - 4,
        "text-anchor": i === 0 ? "start" : i === 3 ? "end" : "middle" });
      lab.textContent = timeLabel(t, x1 - x0);
      svg.append(lab);
    }
    // lines, broken at missing values and gaps
    const over = v => ty(v) > clipAt;
    const yOf = v => over(v) ? T : sy(v);
    const marks = [];
    const path = (series, maxGap) => {
      let d = "", prevT = null, prevOver = false;
      for (const [t, v] of series) {
        if (v === null) { prevT = null; prevOver = false; continue; }
        const cmd = prevT !== null && t - prevT <= maxGap ? "L" : "M";
        d += `${cmd}${sx(t).toFixed(1)},${yOf(v).toFixed(1)}`;
        if (over(v) && !prevOver) marks.push(sx(t));
        prevT = t; prevOver = over(v);
      }
      return d;
    };
    if (peakVals.length) {
      // Peaks are hourly whatever the main line's detail, so join them an hour apart.
      svg.append(svgEl("path", { d: path(peaks, 3600 * 1.5), fill: "none", stroke: "var(--line)",
        "stroke-width": 1.5, "stroke-opacity": 0.4, "stroke-linejoin": "round",
        "stroke-linecap": "round", "vector-effect": "non-scaling-stroke" }));
    }
    svg.append(svgEl("path", { d: path(pts, gap), fill: "none", stroke: "var(--line)", "stroke-width": 2,
      "stroke-linejoin": "round", "stroke-linecap": "round", "vector-effect": "non-scaling-stroke" }));
    // a triangle where a line goes off the top of the chart
    for (const x of new Set(marks.map(x => Math.round(x)))) {
      svg.append(svgEl("path", { d: `M${x - 4},${T + 7}L${x},${T - 1}L${x + 4},${T + 7}Z`,
        fill: "var(--line)" }));
    }
    // single points (e.g. one hour of history) still show up
    if (vals.length === 1) {
      svg.append(svgEl("circle", { cx: sx(vals[0][0]), cy: yOf(vals[0][1]), r: 3, fill: "var(--line)" }));
    }
    card.append(svg);
  });
}

// ---- data ----

const nowS = () => Date.now() / 1000;

// Chart ranges: where the data comes from, and how often to refresh it.
//   live:  the device's RAM history ("short" = 15 min of 10 s, "long" = 24 h of
//          1 min; points = how many to fetch)
//   days:  the hourly log in flash (0 = all of it)
const RANGES = {
  "15m": { live: "short", span: 900, refresh: 10 },
  "6h":  { live: "long", span: 6 * 3600, points: 360, refresh: 60 },
  "1d":  { live: "long", span: 86400, points: 1440, refresh: 60 },
  "7d":  { days: 7, refresh: 600 },
  "30d": { days: 30, refresh: 600 },
  "all": { days: 0, refresh: 600 },
};
let range = "6h";
let lastData = null;     // what renderCharts() last drew, for redraw on resize
let lastFetch = 0;

// Absolute humidity (g/m³) from temperature (°C) and %RH: the Magnus formula,
// as on the device.
function absHumidity(t, rh) {
  return 216.7 * (rh / 100) * 6.112 * Math.exp(17.62 * t / (243.12 + t)) / (273.15 + t);
}

// A metric's value in a row of /api/history (metric units, or null). The log
// keeps %RH, so absolute humidity is worked out from the hour's averages.
function rowValue(d, r, key) {
  if (key === "ah") {
    const t = r[d.fields.indexOf("temp")], rh = r[d.fields.indexOf("rh")];
    return t === null || rh === null ? null : absHumidity(t, rh);
  }
  const col = d.fields.indexOf(key);
  return col < 0 || r[col] === null || r[col] === undefined ? null : r[col];
}

// Hourly rows, last record per hour (a re-written hour supersedes), oldest first.
function hourlyRows(d) {
  const byT = new Map();
  for (const row of d.rows) byT.set(row[0], row);
  return [...byT.values()].sort((a, b) => a[0] - b[0]);
}

// Live (RAM) data. It only goes back to the last boot (before that it's a flat
// placeholder), so the part of the window before boot comes from the hourly log.
// The pollutants' peak line comes from the hourly log throughout (1-minute
// averages smooth the peaks away), ending with the hour so far.
function liveCharts(box, cfg, d, early) {
  const end = d.t || nowS();
  const boot = end - d.uptime;
  // The newest point is the last completed bucket, which ended d.age s ago;
  // each point is plotted at the middle of its bucket.
  const last = end - (d.age || 0) - d.period / 2;
  const allRows = early ? hourlyRows(early) : [];
  const rows = allRows.filter(r => r[0] + 3600 <= boot);
  // Peak rows, each at the middle of its hour (of the part so far, for the
  // current one).
  const peakRows = allRows.map(r => [r[0] + 1800, r]);
  if (early && early.current) {
    const c = early.current;
    peakRows.push([c[0] + Math.max(0, Math.min(3600, end - c[0])) / 2, c]);
  }
  for (const m of METRICS) {
    const arr = d[m.key] || [];
    const n = arr.length;
    const live = arr.map((v, i) => [last - (n - 1 - i) * d.period, v === null ? null : m.conv(v)])
                    .filter(p => p[0] - d.period / 2 >= boot);
    // Each hourly average is plotted at the middle of its hour.
    const hourly = rows.map(r => { const v = rowValue(early, r, m.key);
                                   return [r[0] + 1800, v === null ? null : m.conv(v)]; });
    const peaks = !m.peak ? null : peakRows.map(([t, r]) => {
      const v = rowValue(early, r, m.peak);
      return [t, v === null ? null : m.conv(v)];
    });
    // Join hourly points to each other and to the live data; break on real gaps.
    const gap = hourly.length ? 3600 * 1.5 : d.period * 1.5;
    drawChart(box, m, hourly.concat(live), end - cfg.span, end, gap, peaks);
  }
}

function hourlyCharts(box, cfg, d) {
  const rows = hourlyRows(d);
  const end = nowS();
  const start = cfg.days ? end - cfg.days * 86400 : (rows.length ? rows[0][0] : end - 86400);
  for (const m of METRICS) {
    const pts = rows.map(r => { const v = rowValue(d, r, m.key);
                                return [r[0] + 1800, v === null ? null : m.conv(v)]; });
    // The hour's peak, for the pollutants (null for hours before peaks were kept).
    const pcol = m.peak ? d.fields.indexOf(m.peak) : -1;
    const peaks = pcol < 0 ? null
      : rows.map(r => [r[0] + 1800, r[pcol] === null || r[pcol] === undefined ? null : m.conv(r[pcol])]);
    drawChart(box, m, pts, start, end, d.period * 1.5, peaks);
  }
}

function renderCharts() {
  if (!lastData || lastData.range !== range) return;
  const box = document.getElementById("charts");
  // Hold the current height while rebuilding: the cards are measured as they're
  // added, and a briefly shorter page would make phones jump the scroll position.
  box.style.minHeight = box.offsetHeight + "px";
  box.replaceChildren();
  const cfg = RANGES[range];
  pendingDraws = [];
  if (cfg.live) liveCharts(box, cfg, lastData.live, lastData.early);
  else hourlyCharts(box, cfg, lastData.hourly);
  for (const draw of pendingDraws) draw();
  pendingDraws = [];
  box.style.minHeight = "";
}

async function getJSON(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(path + ": " + r.status);
  return r.json();
}

function setStatus(text, offline) {
  const s = document.getElementById("status");
  s.textContent = text;
  s.classList.toggle("offline", !!offline);
}

async function pollNow() {
  try {
    const d = await getJSON("/api/now");
    US = d.us_units;
    renderTiles(d);
    const when = d.t ? new Date(d.t * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
                     : "clock not set yet";
    const batt = d.batt_pct === null ? "" : " · battery " + d.batt_pct.toFixed(0) + "%";
    setStatus("updated " + when + " · up " + Math.floor(d.uptime / 3600) + " h" + batt);
  } catch (e) {
    setStatus("offline — retrying", true);
  }
}

async function pollCharts() {
  const want = range;
  const cfg = RANGES[want];
  try {
    let data;
    if (cfg.live) {
      const live = await getJSON("/api/recent" +
        (cfg.live === "short" ? "?window=short" : "?points=" + cfg.points));
      // Hourly data, for the peaks and to cover the time before the last boot.
      const early = cfg.live === "long"
        ? await getJSON("/api/history?since=" + Math.floor(nowS() - cfg.span - 3600)) : null;
      data = { range: want, live, early };
    } else {
      const since = cfg.days ? Math.floor(nowS() - cfg.days * 86400) : 0;
      data = { range: want, hourly: await getJSON("/api/history?since=" + since) };
    }
    if (want !== range) return;      // the user switched while this was loading
    lastData = data;
    lastFetch = nowS();
    renderCharts();
  } catch (e) {}
}

document.getElementById("ranges").addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  range = b.dataset.range;
  for (const x of document.querySelectorAll("#ranges button")) x.classList.toggle("on", x === b);
  pollCharts();
});

// Redraw at the new width when the window is resized.
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderCharts, 200);
});

(async () => {
  await pollNow();          // learn the units first
  pollCharts();
  setInterval(pollNow, 5000);
  // Refresh the charts as often as the selected range calls for.
  setInterval(() => {
    if (nowS() - lastFetch >= RANGES[range].refresh) pollCharts();
  }, 5000);
})();
</script>
</body>
</html>
