# West manifest for the sensor-box application (T3 "freestanding app" layout).
#
# This repo is the manifest repo. `west update` pulls Zephyr — and, via
# import, the modules on the allowlist below — as sibling directories outside
# this repo. Bump `revision` deliberately to move to a new Zephyr release;
# module versions follow from Zephyr's own manifest.
#
#   west init -l .
#   west update
#
manifest:
  version: "1.2"

  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: upstream
      revision: v4.4.0
      # Pull in only the Zephyr modules this app needs. (Anything else in
      # Zephyr's manifest, e.g. mcuboot, is not fetched.)
      import:
        name-allowlist:
          - hal_espressif         # ESP32-C6 SoC HAL + Wi-Fi blobs
          - lvgl                  # TFT UI
          - mbedtls               # crypto for Wi-Fi (WPA2), selected by the ESP32 Wi-Fi driver
          - picolibc              # C library
          - tf-psa-crypto         # PSA crypto core used by mbedtls

  self:
    path: sensor-box
