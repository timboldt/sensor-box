# Application Kconfig — merged on top of the board's *_defconfig.

# Logging subsystem (LOG_INF / LOG_WRN / LOG_ERR), routed to the console.
CONFIG_LOG=y

# Print floating-point values with %f (sensor readings later).
CONFIG_CBPRINTF_FP_SUPPORT=y

# Main thread stack — bumped a little ahead of the sensor work to come.
CONFIG_MAIN_STACK_SIZE=4096

# I2C bus + sensor subsystem + drivers.
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BME280=y
CONFIG_TSL2591=y

# Out-of-tree drivers (drivers/sensor/*).
CONFIG_PMSA003I=y
CONFIG_SGP30=y

# Fuel-gauge subsystem + the on-board MAX17048.
CONFIG_FUEL_GAUGE=y
CONFIG_MAX17048=y

# Fixed regulator driver — powers the STEMMA QT / I2C switch (IO20).
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# Interactive shell on the console, with I2C and sensor subcommands.
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_SENSOR_SHELL=y
