# Application Kconfig — merged on top of the board's *_defconfig.

# Logging subsystem (LOG_INF / LOG_WRN / LOG_ERR), routed to the console.
CONFIG_LOG=y
# Only warnings and errors are shown by default. Info messages are still
# built in: turn them on from the shell, e.g. "log enable inf wifi" (one
# module) or "log enable inf" (all); "log status" lists modules and levels.
CONFIG_SHELL_BACKEND_SERIAL_LOG_LEVEL_WRN=y
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=2
CONFIG_LOG_CMDS=y

# Print floating-point values with %f (sensor readings later).
CONFIG_CBPRINTF_FP_SUPPORT=y

# Main thread stack — sensors plus building the LVGL screen.
CONFIG_MAIN_STACK_SIZE=6144

# I2C bus + sensor subsystem + drivers.
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BME280=y
CONFIG_TSL2591=y

# Out-of-tree drivers (drivers/sensor/*).
CONFIG_PMSA003I=y
CONFIG_SGP30=y

# Fuel-gauge subsystem + the on-board MAX17048.
CONFIG_FUEL_GAUGE=y
CONFIG_MAX17048=y
# INA219 (battery current) is enabled by its devicetree node.

# Fixed regulator driver — powers the STEMMA QT / I2C switch (IO20).
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# Interactive shell on the console, with I2C and sensor subcommands.
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_SENSOR_SHELL=y
# "kernel reboot cold" on the shell.
CONFIG_REBOOT=y

# Display: ILI9341 on SPI via the MIPI-DBI layer (see app.overlay).
CONFIG_SPI=y
CONFIG_DISPLAY=y

# Backlight PWM (LEDC), hand-wired LITE -> A5 / IO2.
CONFIG_PWM=y

# Boot button (gpio-keys, IO9) pages through the chart screens.
CONFIG_INPUT=y
# The button handler updates a chart page (LVGL + float formatting) on the
# input thread: ~1.3 KB measured, over the 1 KB default.
CONFIG_INPUT_THREAD_STACK_SIZE=4096

# LVGL, run on its own workqueue so the 1 Hz sensor loop never stalls the UI.
# Calls into LVGL from other threads must hold lvgl_lock().
CONFIG_LVGL=y
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=y
# Rendering the trend charts needs ~5.4 KB, overflowing the 4 KB default
# (which silently corrupted the neighbouring input thread's stack).
CONFIG_LV_Z_LVGL_WORKQUEUE_STACK_SIZE=8192
CONFIG_LV_COLOR_DEPTH_24=y
CONFIG_LV_Z_MEM_POOL_SIZE=49152
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_28=y

# Settings in the flash "storage" partition (NVS): the SGP30 baseline.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# microSD card in the FeatherWing's slot (src/sdcard.c), FAT formatted.
# Never format a card automatically when it won't mount (Zephyr's default
# would): only "sdcard format yes" from the console does.
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
# Bring the card up before the display's first SPI traffic (display init
# is at 85): a card that sees other traffic on the bus before its first
# reset can end up in SD (not SPI) mode until it loses power. See
# sdcard_early_init() in src/sdcard.c.
CONFIG_SDHC_INIT_PRIORITY=81
CONFIG_SD_INIT_PRIORITY=82
# "fs ls /SD:" etc. on the console.
CONFIG_FILE_SYSTEM_SHELL=y

# Long-term hourly history: a flash circular buffer in the "history"
# partition (app.overlay); see src/ltlog.c.
CONFIG_FCB=y

# Wi-Fi station with DHCP. Credentials are stored on the device (settings),
# added from the console with "wifi cred add"; see src/wifi.c.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_IPV4=y
# IPv6 (link-local, plus SLAAC if the router offers it) mostly so mDNS can
# answer AAAA queries: without it the responder ignores them, and macOS waits
# 5 s for an answer on every lookup of sensor-box.local. The HTTP server then
# listens on IPv6 and takes IPv4 connections as v4-mapped addresses.
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4_MAPPING_TO_IPV6=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_SHELL=y

# Wall-clock time from SNTP (UTC), using DHCP's DNS server; "date get" on
# the shell shows it. See src/timesync.c.
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_SNTP=y
CONFIG_DATE_SHELL=y

# LAN web dashboard on port 80 (src/web.c), reachable as sensor-box.local.
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_STACK_SIZE=4096
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_MAX_CONN=10
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_ZVFS_POLL_MAX=12
# The socket service (DNS/mDNS) already takes the default single eventfd;
# the HTTP server needs its own (it failed with eventfd -ENOMEM).
CONFIG_ZVFS_EVENTFD_MAX=4
# The socket service thread (DNS, mDNS) measured 85% of its 1.4 KB default.
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=2048
CONFIG_MDNS_RESPONDER=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="sensor-box"
# Wi-Fi and credential shell commands need more than the 2 KB default; the
# system workqueue runs the stored-network connect.
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
# ISR stack doubled to 4 KB as margin. With the dashboard build it measured
# ~1 KB; some earlier Wi-Fi builds read ~100% at any size (2, 4 and 8 KB),
# apparently because start-up overwrote the region, not real use.
CONFIG_ISR_STACK_SIZE=4096
# With two access points for the same network, join the strongest rather
# than the first one found.
CONFIG_ESP32_WIFI_STA_SCAN_ALL=y

# On-screen clock: US Pacific (UTC-8, with US daylight saving time).
CONFIG_SENSOR_BOX_UTC_OFFSET_MIN=-480
CONFIG_SENSOR_BOX_US_DST=y

# Altitude for sea-level pressure (house is ~100-110 m).
CONFIG_SENSOR_BOX_ALTITUDE_M=100

# Display temperature in F and pressure in inHg (log stays metric).
CONFIG_SENSOR_BOX_US_UNITS=y
