# Application Kconfig — merged on top of the board's *_defconfig.

# Logging subsystem (LOG_INF / LOG_WRN / LOG_ERR), routed to the console.
CONFIG_LOG=y

# Print floating-point values with %f (sensor readings later).
CONFIG_CBPRINTF_FP_SUPPORT=y

# Main thread stack — bumped a little ahead of the sensor work to come.
CONFIG_MAIN_STACK_SIZE=4096
